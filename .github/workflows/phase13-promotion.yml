name: phase13-promotion

on:
  pull_request:
  push:
    branches: [main]

jobs:
  phase13-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_promotion_governance.py tests/test_contracts.py
      - name: Reference readiness
        run: |
          awa-promotion evaluate \
            --conflict-set fixtures/promotion/phase13.selection.conflict-set.json \
            --policy fixtures/promotion/phase13.explicit-rank.policy.json \
            --out build/phase13-promotion
          python -c "import json,pathlib; assert json.loads(pathlib.Path('build/phase13-promotion/promotion-readiness-receipt.json').read_text()) == json.loads(pathlib.Path('fixtures/promotion/expected.phase13.selection.readiness.json').read_text())"
      - name: Reference authority verification
        run: |
          awa-promotion authorize \
            --readiness build/phase13-promotion/promotion-readiness-receipt.json \
            --grant fixtures/promotion/phase13.relay-glow-a.authority-grant.json \
            --out build/phase13-authority
          python -c "import json,pathlib; assert json.loads(pathlib.Path('build/phase13-authority/promotion-authority-receipt.json').read_text()) == json.loads(pathlib.Path('fixtures/promotion/expected.phase13.relay-glow-a.authority.json').read_text())"
