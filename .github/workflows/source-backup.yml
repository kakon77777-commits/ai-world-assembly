name: source-backup

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        shell: bash
        run: |
          mkdir -p dist
          archive="ai-world-assembly-${GITHUB_SHA}.zip"
          git archive --format=zip --output="dist/${archive}" HEAD
          sha256sum "dist/${archive}" > "dist/${archive}.sha256"
      - name: Upload source backup
        uses: actions/upload-artifact@v4
        with:
          name: source-backup-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
