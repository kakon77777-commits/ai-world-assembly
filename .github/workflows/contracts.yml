name: contracts

on:
  push:
    branches: ["main", "bootstrap/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  compilableworld-intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AWA
        uses: actions/checkout@v4
      - name: Checkout pinned CompilableWorld compatibility target
        uses: actions/checkout@v4
        with:
          repository: kakon77777-commits/compilableworld-runtime-mvp
          ref: cf37f539e0807499e8b337f80a5f152324c087f2
          path: _vendor/compilableworld-runtime-mvp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Emit Phase 5 CompilableWorld Authoring Layer
        run: |
          awa-cw-intake emit \
            --semantic-snapshot fixtures/sedb/expected.game.alien_lineage.snapshot.json \
            --composition-receipt fixtures/csc_ocm/expected.alien_lineage.composition-receipt.json \
            --asset-graph-snapshot fixtures/compilableworld_intake/asset-graph.resolved.json \
            --plan fixtures/compilableworld_intake/alien_lineage.intake-plan.json \
            --out build/alien-lineage-cw
      - name: Validate Phase 5 with real CompilableWorld compiler
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: python -m compilableworld validate build/alien-lineage-cw
      - name: Compile Phase 5 with real CompilableWorld compiler
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: python -m compilableworld compile build/alien-lineage-cw --out build/alien-lineage-runtime
      - name: Run native CompilableWorld move ScenarioIR
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: python -m compilableworld scenario-run build/alien-lineage-runtime/world.package.json alien-lineage.move-smoke
      - name: Build bounded Phase 6 Alien Lineage authoring
        run: |
          awa-alien-lineage build \
            --semantic-snapshot fixtures/sedb/expected.game.alien_lineage.snapshot.json \
            --composition-receipt fixtures/csc_ocm/expected.alien_lineage.composition-receipt.json \
            --asset-graph-snapshot fixtures/compilableworld_intake/asset-graph.resolved.json \
            --plan fixtures/alien_lineage_runtime/alien_lineage.intake-plan.json \
            --slice fixtures/alien_lineage_runtime/runtime-slice.json \
            --out build/alien-lineage-phase6
      - name: Validate Phase 6 with real CompilableWorld compiler
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: python -m compilableworld validate build/alien-lineage-phase6
      - name: Compile Phase 6 with real CompilableWorld compiler
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: python -m compilableworld compile build/alien-lineage-phase6 --out build/alien-lineage-phase6-runtime
      - name: Run native move smoke on Phase 6 package
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: python -m compilableworld scenario-run build/alien-lineage-phase6-runtime/world.package.json alien-lineage.move-smoke
      - name: Run full Alien Lineage ScenarioIR with declared external module
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: awa-alien-lineage scenario-run build/alien-lineage-phase6-runtime/world.package.json alien-lineage.full-cycle --assertions fixtures/alien_lineage_runtime/full-cycle.assertions.json
      - name: Build Phase 10 transaction-safe spawn authoring
        run: |
          awa-alien-lineage spawn-build \
            --semantic-snapshot fixtures/sedb/expected.game.alien_lineage.snapshot.json \
            --composition-receipt fixtures/csc_ocm/expected.alien_lineage.composition-receipt.json \
            --asset-graph-snapshot fixtures/compilableworld_intake/asset-graph.resolved.json \
            --plan fixtures/alien_lineage_runtime/alien_lineage.intake-plan.json \
            --slice fixtures/alien_lineage_runtime/runtime-slice.json \
            --spawn-profile fixtures/alien_lineage_runtime/spawn-profile.json \
            --out build/alien-lineage-phase10
      - name: Validate and compile Phase 10 with pinned CompilableWorld
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: |
          python -m compilableworld validate build/alien-lineage-phase10
          python -m compilableworld compile build/alien-lineage-phase10 --out build/alien-lineage-phase10-runtime
      - name: Run true egg and child Runtime Entity lifecycle
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: awa-alien-lineage scenario-run build/alien-lineage-phase10-runtime/world.package.json alien-lineage.full-cycle --assertions fixtures/alien_lineage_runtime/full-cycle.spawn-assertions.json
      - name: Prove Alien Lineage spawn rolls back on durable EventLog failure
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from unittest.mock import patch
          from compilableworld.entity_transaction import EntityTransactionRuntime
          from compilableworld.kernel import KernelTransactionError
          from compilableworld.models import ActionIR
          from awa_alien_lineage.runtime import install_alien_lineage_runtime

          package=json.loads(Path('build/alien-lineage-phase10-runtime/world.package.json').read_text())
          runtime=EntityTransactionRuntime(package)
          install_alien_lineage_runtime(runtime)
          actor='creature.crystal-filterer.001'
          sequence=[
              ActionIR(actor,'move',args={'direction':'north'}),
              ActionIR(actor,'feed',target_id='item.mineral-bloom'),
              ActionIR(actor,'feed',target_id='item.mineral-bloom'),
              ActionIR(actor,'feed',target_id='item.mineral-bloom'),
              ActionIR(actor,'mutate',args={'organ_id':'organ.crystal-gill'}),
              ActionIR(actor,'grow'),
              ActionIR(actor,'move',args={'direction':'south'}),
          ]
          for action in sequence:
              receipt=runtime.submit(action)
              assert receipt.status.value=='completed', receipt
          energy=runtime.state.get(actor,'biology','energy')
          state_before=runtime.state.export()
          events_before=len(runtime.event_log.events)
          assert not runtime.registry.contains('egg.crystal-filterer.001')
          with patch.object(runtime.event_log,'append_batch',side_effect=KernelTransactionError('phase10 simulated durable failure')):
              try:
                  runtime.submit(ActionIR(actor,'lay_egg'))
              except KernelTransactionError:
                  pass
              else:
                  raise AssertionError('expected KernelTransactionError')
          assert runtime.state.export()==state_before
          assert runtime.state.get(actor,'biology','energy')==energy
          assert not runtime.registry.contains('egg.crystal-filterer.001')
          assert 'egg.crystal-filterer.001' not in runtime.dynamic_entities
          assert len(runtime.event_log.events)==events_before
          PY
      - name: Setup Node for Three.js target
        uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Test and build Three.js presentation target
        working-directory: presentation/threejs
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm test
          npm run build
      - name: Verify Three.js target artifact closure
        run: awa-threejs verify-assets presentation/threejs/dist
      - name: Run live Three.js browser smoke against real CompilableWorld Runtime
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: |
          awa-threejs serve build/alien-lineage-phase6-runtime/world.package.json \
            --binding fixtures/threejs/alien-lineage.presentation-binding.json \
            --static-dir presentation/threejs/dist \
            --port 8767 > /tmp/awa-threejs.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; cat /tmp/awa-threejs.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8767/health >/dev/null; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8767/api/projection | grep -q 'creature.crystal-filterer.001'
          presentation/threejs/scripts/browser-smoke.sh http://127.0.0.1:8767/?smoke=1
      - name: Run Phase 10 browser spawn witness
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: |
          awa-threejs serve build/alien-lineage-phase10-runtime/world.package.json \
            --binding fixtures/threejs/alien-lineage.presentation-binding.json \
            --static-dir presentation/threejs/dist \
            --port 8769 > /tmp/awa-threejs-phase10.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; cat /tmp/awa-threejs-phase10.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/health >/dev/null; then break; fi
            sleep 0.2
          done
          presentation/threejs/scripts/browser-smoke.sh 'http://127.0.0.1:8769/?smoke=1&spawn=1'
      - name: Run bounded Phase 8 assembler repair loop
        run: |
          BEFORE=$(find fixtures/asset_graph/nodes fixtures/asset_graph/edges fixtures/asset_graph/artifacts fixtures/asset_graph/validations -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          awa-assembler run \
            --task fixtures/assembler/alien-lineage.attack-audio.task.json \
            --semantic-snapshot fixtures/sedb/expected.game.alien_lineage.snapshot.json \
            --composition-receipt fixtures/csc_ocm/expected.alien_lineage.composition-receipt.json \
            --presentation-binding fixtures/threejs/alien-lineage.presentation-binding.json \
            --capability-contract fixtures/assembler/audio_generation.capability.json \
            --nodes fixtures/asset_graph/nodes \
            --edges fixtures/asset_graph/edges \
            --artifacts fixtures/asset_graph/artifacts \
            --validations fixtures/asset_graph/validations \
            --out build/phase8-assembler
          AFTER=$(find fixtures/asset_graph/nodes fixtures/asset_graph/edges fixtures/asset_graph/artifacts fixtures/asset_graph/validations -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          test "$BEFORE" = "$AFTER"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('build/phase8-assembler/assembler-run-receipt.json').read_text())
          assert receipt['status']=='validated_candidate', receipt
          assert [a['validation_status'] for a in receipt['attempts']]==['failed','passed'], receipt
          assert receipt['attempts'][0]['artifact_sha256']=='23fc92432963f74bd638f38ea9d7ddb475853f022810bdc8b344269bf43d5830'
          assert receipt['attempts'][1]['artifact_sha256']=='28f03358e57423849a0a88e87221412ad7421c5c1defea70662f8e23191baabf'
          assert receipt['selected_candidate']['sha256']==receipt['attempts'][1]['artifact_sha256']
          assert receipt['graph_preview']['missing_required']==0
          assert receipt['graph_preview']['generation_tasks']==0
          assert receipt['graph_preview']['target_effective_status']=='passed'
          assert receipt['promotion']['status']=='validated_candidate'
          assert receipt['promotion']['canonical_write'] is False
          candidate=Path('build/phase8-assembler/candidate/crystal_filterer_attack.wav')
          import hashlib
          assert hashlib.sha256(candidate.read_bytes()).hexdigest()==receipt['selected_candidate']['sha256']
          PY
      - name: Run bounded Phase 9 presentation recipe repair loop
        run: |
          BEFORE=$(find fixtures/assembler_presentation_graph presentation/threejs/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          awa-assembler run \
            --task fixtures/assembler/alien-lineage.mutation-effect-recipe.task.json \
            --semantic-snapshot fixtures/sedb/expected.game.alien_lineage.snapshot.json \
            --composition-receipt fixtures/csc_ocm/expected.alien_lineage.composition-receipt.json \
            --presentation-binding fixtures/threejs/alien-lineage.presentation-binding.json \
            --capability-contract fixtures/assembler/presentation_recipe_generation.capability.json \
            --nodes fixtures/assembler_presentation_graph/nodes \
            --edges fixtures/assembler_presentation_graph/edges \
            --artifacts fixtures/assembler_presentation_graph/artifacts \
            --validations fixtures/assembler_presentation_graph/validations \
            --out build/phase9-assembler
          AFTER=$(find fixtures/assembler_presentation_graph presentation/threejs/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          test "$BEFORE" = "$AFTER"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          receipt=json.loads(Path('build/phase9-assembler/assembler-run-receipt.json').read_text())
          assert receipt['status']=='validated_candidate', receipt
          assert [a['validation_status'] for a in receipt['attempts']]==['failed','passed'], receipt
          assert receipt['attempts'][0]['artifact_sha256']=='c1b753e2c8f7150566a146f0e517a323bf4d6ea7d47257aadc23379ad27fdd99'
          assert receipt['attempts'][1]['artifact_sha256']=='c26cd3b1af92ca515ca81680f2982bb296237ff38f4fe95ca930f2eb83bcaeb5'
          first='\n'.join(receipt['attempts'][0]['diagnostics'])
          assert 'runtime_action' in first and 'duration_ms' in first, first
          assert receipt['selected_candidate']['sha256']==receipt['attempts'][1]['artifact_sha256']
          assert receipt['graph_preview']['missing_required']==0
          assert receipt['graph_preview']['generation_tasks']==0
          assert receipt['graph_preview']['target_effective_status']=='passed'
          assert receipt['promotion']['canonical_write'] is False
          candidate=Path('build/phase9-assembler/candidate/mutation_effect_recipe.json')
          assert hashlib.sha256(candidate.read_bytes()).hexdigest()==receipt['selected_candidate']['sha256']
          recipe=json.loads(candidate.read_text())
          assert recipe['contract']=='presentation-effect-recipe.v0.1'
          assert recipe['event_type']=='alien_lineage.creature_mutated'
          assert 'runtime_action' not in recipe
          PY
          mkdir -p presentation/threejs/dist/candidate
          cp build/phase9-assembler/candidate/mutation_effect_recipe.json presentation/threejs/dist/candidate/
      - name: Run validated Phase 9 recipe as temporary Three.js candidate overlay
        env: {PYTHONPATH: _vendor/compilableworld-runtime-mvp/src}
        run: |
          awa-threejs serve build/alien-lineage-phase6-runtime/world.package.json \
            --binding fixtures/threejs/alien-lineage.presentation-binding.json \
            --static-dir presentation/threejs/dist \
            --port 8768 > /tmp/awa-threejs-phase9.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; cat /tmp/awa-threejs-phase9.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8768/health >/dev/null; then break; fi
            sleep 0.2
          done
          presentation/threejs/scripts/browser-smoke.sh 'http://127.0.0.1:8768/?smoke=1&effectRecipe=/candidate/mutation_effect_recipe.json'
