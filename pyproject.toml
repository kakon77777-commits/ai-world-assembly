[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-world-assembly"
version = "0.4.0"
description = "Contract-first integration and deterministic assembly layer for AI World Assembly"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
awa-contracts = "awa_contracts.__main__:main"
awa-sedb-export = "awa_sedb_adapter.__main__:main"
awa-compose = "awa_composition.__main__:main"
awa-asset-graph = "awa_asset_graph.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
